<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" fill="none">
  <!-- Official Sally's Legal Apparel Emblem -->
  <defs>
    <!-- Horizontal cutout mask splitting the S, L, A monogram -->
    <mask id="sla-cutout-mask">
      <rect width="1000" height="520" fill="white" />
      <!-- Cutout gap across the middle of all three letters -->
      <rect x="50" y="225" width="900" height="70" fill="black" />
    </mask>
  </defs>

  <!-- SLA Letters with Cutout Mask -->
  <g mask="url(#sla-cutout-mask)" fill="#1A1A1A">
    <!-- Letter S: Bold geometric editorial curves -->
    <path d="
      M 285 105 
      C 285 45 230 25 175 25 
      C 105 25 65 65 65 140 
      C 65 210 115 240 185 260 
      C 235 275 255 295 255 335 
      C 255 385 215 415 165 415 
      C 105 415 65 375 65 325 
      L 145 325 
      C 145 355 165 365 180 365 
      C 200 365 215 350 215 335 
      C 215 290 170 270 115 250 
      C 75 235 45 200 45 145 
      C 45 70 95 15 175 15 
      C 245 15 305 60 305 130 
      Z
    " />

    <!-- Letter L: Heavy stalk with signature upward-angled wedge foot -->
    <!-- M 415 20 H 510 V 320 L 640 255 V 415 H 415 Z -->
    <path d="
      M 415 20 
      H 510 
      V 325 
      L 635 260 
      V 415 
      H 415 
      Z
    " />

    <!-- Letter A: Bold triangular apex with angled outer and inner legs -->
    <path d="
      M 770 20 
      H 820 
      L 945 415 
      H 850 
      L 825 320 
      H 760 
      L 735 415 
      H 645 
      Z 
      M 795 110 
      L 775 240 
      H 815 
      Z
    " />
  </g>

  <!-- Horizontal Cutout Banner Full Brand Text -->
  <text 
    x="500" 
    y="267" 
    text-anchor="middle" 
    font-family="'Manrope', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="31" 
    font-weight="700" 
    letter-spacing="0.22em" 
    fill="#1A1A1A"
  >SALLY'S LEGAL APPAREL</text>
</svg>
